# Platform trolley (xiaotuiche) physical model. Lengths in metres, masses in kg.
# Dimensions were measured from xiaotuiche.obj (millimetres): footprint 1.19 x 0.59 x 0.94,
# wheels at the four corners (z 0-0.06), deck top at z 0.23, top rail z 0.85-0.94 spanning 0.54 in y.
# Base frame: origin on the ground under the deck centre, x towards the far end, y left, z up.
# The handle end (grasped by the robot) is at negative x.
model: caster            # caster: passive articulation with 4 swivel casters | rigid: single body with 4 low-friction pads
mass:
  base_kg: 12.0
  payload_kg_range: [0.0, 50.0]      # domain randomisation, added to base_link (phase B)
deck:
  size: [0.98, 0.52, 0.045]
  center_z: 0.21
frame:
  x_positions: [-0.49, 0.49]         # near (handle) end and far end
  post_half_y: 0.26
  post_section: [0.03, 0.03]
shelves:                             # two full shelves above the deck (visible in the mesh at z 0.4-0.5 and 0.7-0.8)
  heights: [0.45, 0.75]
  size: [0.98, 0.52, 0.03]
handle:
  radius: 0.0075                     # visual-only bar. 7.5 mm is the largest radius with zero visual overlap
                                     # against the baked Dex3 grasp (palm z axis is 6.6 deg off the bar axis).
  real_tube_radius: 0.011            # measured on xiaotuiche.obj (posts 22 mm across); not used by physics
  length: 0.54
  collision: false                   # hands have no colliders in HOMIE's URDF; the bar is visual only
                                     # (the OBJ has no horizontal bar between the posts; the URDF adds it)
wheels:
  positions_xy: [[-0.5, -0.25], [-0.5, 0.25], [0.5, -0.25], [0.5, 0.25]]
  radius: 0.06
  width: 0.03
  caster_trail: 0.03
  # Collision shape of the wheel in the URDF/USD (visual stays a cylinder). Isaac Lab disables PhysX's exact
  # cylinder geometry (/physics/collisionCylinderCustomGeometry=False), so a cylinder wheel is a faceted convex hull
  # that hops while rolling (cart-alone test: 187 mm lift, stops in 2 s). A sphere of the same radius rolls exactly.
  collider: sphere
  swivel_mass_kg: 0.2
  wheel_mass_kg: 0.4
  # Passive joints: viscous damping on the drives (no stiffness, no target) is the rolling / swivel resistance.
  # 4 wheels x 0.005 N.m.s/rad at 1 m/s (16.7 rad/s) -> ~5.6 N drag: ~4 % of the empty cart weight, ~1 % at 50 kg payload.
  swivel_damping: 0.05
  wheel_damping: 0.005
  # Rubber tyre on floor. HOMIE's ground material is 1.0/1.0/0; PhysX combines by average -> ~0.9 effective.
  friction: 0.8
  restitution: 0.0
  # Phase B domain randomisation (per env, applied through the articulation view like HOMIE's foot friction)
  friction_range: [0.4, 1.2]
  wheel_damping_range: [0.002, 0.02]
  swivel_damping_range: [0.02, 0.15]
body:
  # deck / posts / shelves: painted steel. Robot <-> cart contacts are filtered at the asset level (the feet are the
  # robot's only colliders and a foot-caster contact would close a rigid loop through the grasp joints); the task
  # penalises foot-caster proximity instead. (Modelling choice, not the cause of the first run's kN forces.)
  friction: 0.6
  restitution: 0.0
solver:
  # PhysX solver iterations of the cart articulation (Isaac). The robot keeps HOMIE's 4 / 0; a joint between two
  # articulations is solved with the larger of the two counts, so raising the cart's count tightens the
  # robot-grasp-cart loop without changing HOMIE's own dynamics. (Precaution; the attribution runs showed 4/0 vs
  # 16/4 made no difference to the first run's blow-ups, which came from the wheel-stall brake.)
  position_iterations: 16
  velocity_iterations: 4
curriculum:
  # Difficulty is raised through payload and rolling resistance, not through lower wheel friction: a low friction
  # coefficient makes the casters skid and drift, which is harder, not easier. Friction only widens its
  # randomisation band. A stage advances when the cart-velocity tracking reward exceeds `advance_when` (phase B).
  advance_when: 0.8
  stages:
    - name: light
      payload_kg_range: [0.0, 5.0]
      wheel_damping_range: [0.002, 0.005]
      wheel_friction_range: [0.7, 1.0]
      cart_push_vel_range: [0.0, 0.0]
      command_lin_vel_range: [0.0, 0.5]
      command_ang_vel_range: [-0.3, 0.3]
    - name: medium
      payload_kg_range: [0.0, 20.0]
      wheel_damping_range: [0.002, 0.01]
      wheel_friction_range: [0.6, 1.1]
      cart_push_vel_range: [0.0, 0.3]
      command_lin_vel_range: [-0.2, 0.8]
      command_ang_vel_range: [-0.5, 0.5]
    - name: heavy
      payload_kg_range: [0.0, 50.0]
      wheel_damping_range: [0.002, 0.02]
      wheel_friction_range: [0.4, 1.2]
      cart_push_vel_range: [0.0, 0.5]
      command_lin_vel_range: [-0.3, 1.0]
      command_ang_vel_range: [-0.6, 0.6]
interaction:
  # Robot <-> cart forces flow through the two palm FixedJoints (unbreakable in PhysX; joints cannot be re-enabled
  # after a break, so the episode ends instead). The palm incoming joint wrench is read with a JointWrenchSensor.
  grasp_overload_force_n_range: [150.0, 400.0]   # episode termination threshold, sampled per env at reset
  grasp_wrench_penalty_scale: -1.0e-3
  feet_cart_contact_penalty_scale: -1.0           # feet kicking casters / posts (contact sensor on the feet)
  arm_compliance_note: "wrist PD stiffness 20, elbow 100, shoulder 200 N.m/rad from HOMIE's control cfg"
visual:
  obj: HomieRL/legged_gym/resources/object/xiaotuiche.obj
  scale: 0.001
  offset: [-0.66630, -0.75072, 0.0]  # moves the mesh's footprint centre / wheel bottom onto the base origin
  opacity: 0.35
# Filled by `pushcart.py cart build` from initial_pose.yaml. Do not edit by hand.
derived:
  handle_height: 0.9172187571624246
  bar_center_world:
  - 0.3177069274708008
  - 5.0000000000050004e-06
  - 0.9172187571624246
  bar_axis_world:
  - 0.0
  - 1.0
  - 0.0
  base_pos_world:
  - 0.8077069274708009
  - 5.0000000000050004e-06
  - 0.0
  base_yaw: 0.0
